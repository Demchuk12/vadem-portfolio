name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Both languages are prerendered
        run: |
          grep -q 'lang="en"' dist/portfolio/browser/index.html
          grep -q 'lang="uk"' dist/portfolio/browser/uk/index.html
